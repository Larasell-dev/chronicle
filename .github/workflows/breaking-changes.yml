name: Breaking changes

# A pull request whose title is marked as breaking ("feat!: ...") must add an upgrade note to
# breaking-changes/, and a pull request that adds one must be marked as breaking. Runs on title
# edits too, since squash merges use the title as the commit release-please reads.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  documented:
    name: Breaking changes are documented
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check upgrade notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/breaking-changes.mjs check
