name: CI

# Pushes to main run too, because a squash merge tests a commit no pull request ran on.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Finish every cell, so one failure shows whether it is specific to a PHP or Laravel version.
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        laravel: [12, 13]
        include:
          # composer.lock holds Laravel 13, so that cell tests exactly what is locked.
          - laravel: 13
            locked: true

    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install locked dependencies
        if: matrix.locked
        run: composer install --prefer-dist --no-interaction --no-progress

      # Re-resolves the lock for this Laravel version, which also picks the matching Testbench
      # and Pest (Laravel 12 needs Testbench 10 and Pest 4). composer.json stays unchanged.
      - name: Install Laravel ${{ matrix.laravel }}
        if: ${{ !matrix.locked }}
        run: >-
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
          --with "laravel/framework:^${{ matrix.laravel }}.0"

      - name: Run tests
        run: vendor/bin/pest

  commitlint:
    name: Commitlint
    # Reads the pull request's base commit, which a push doesn't have.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Commitlint
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=HEAD

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PHPStan

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Pint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test
